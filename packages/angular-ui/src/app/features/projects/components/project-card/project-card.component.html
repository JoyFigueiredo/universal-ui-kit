<div class="project-card" [class.expanded]="expanded">

    <div class="project-image-wrapper">

        <img [src]="images[currentImage]" class="project-image" [alt]="title" />

        <div class="image-overlay"></div>

        <button class="image-nav left" *ngIf="expanded" (click)="prevImage($event)">

            <i class="fa-solid fa-chevron-left"></i>

        </button>

        <button class="image-nav right" *ngIf="expanded" (click)="nextImage($event)">

            <i class="fa-solid fa-chevron-right"></i>

        </button>

    </div>

    <div class="project-content">

        <span class="project-category">
            {{ category }}
        </span>

        <h3 class="project-title">
            {{ title }}
        </h3>

        <p class="project-description">
            {{ description }}
        </p>

        <div class="project-technologies" *ngIf="expanded">

            <span *ngFor="let tech of technologies" class="tech-tag">

                {{ tech }}

            </span>

        </div>

        <span class="expand-text" (click)="toggleExpand(); $event.stopPropagation()">

            {{ expanded ? 'Ver menos' : 'Ver mais' }}

        </span>

        <div class="project-footer" (click)="$event.stopPropagation()">

            <ui-button label="Ver Projeto" variant="secondary" icon="fa-brands fa-github" (action)="verProjeto()">

            </ui-button>

        </div>

    </div>

</div>
