<section id="contact" class="reveal">

    <div class="contact-container">

        <div class="contact-info">

            <span class="contact-tag">
                ENTRE EM CONTATO
            </span>

            <h2 class="contact-title">
                Vamos criar algo incrível juntos.
            </h2>

            <p class="contact-description">
                Estou disponível para oportunidades,
                projetos freelance, colaboração e
                desenvolvimento de soluções digitais.
            </p>

            <div class="contact-cards">

                <div class="contact-card">

                    <i class="fa-solid fa-envelope"></i>

                    <div>
                        <h3>Email</h3>
                        <p>joicebfigueiredo@gmail.com</p>
                    </div>

                </div>

                <div class="contact-card">

                    <i class="fa-brands fa-linkedin"></i>

                    <div>
                        <h3>LinkedIn</h3>
                        <p>/in/joicebfigueiredo</p>
                    </div>

                </div>

                <div class="contact-card">

                    <i class="fa-brands fa-github"></i>

                    <div>
                        <h3>GitHub</h3>
                        <p>/JoyFigueiredo</p>
                    </div>

                </div>

            </div>

        </div>

        <form
            class="contact-form"
            (ngSubmit)="enviarMensagem()">

            <div class="input-group">

                <input
                    type="text"
                    placeholder="Seu nome"
                    [(ngModel)]="nome"
                    name="nome"
                    required>

            </div>

            <div class="input-group">

                <input
                    type="email"
                    placeholder="Seu email"
                    [(ngModel)]="email"
                    name="email"
                    required>

            </div>

            <div class="input-group">

                <input
                    type="text"
                    placeholder="Assunto"
                    [(ngModel)]="assunto"
                    name="assunto"
                    required>

            </div>

            <div class="input-group">

                <textarea
                    rows="6"
                    placeholder="Sua mensagem"
                    [(ngModel)]="mensagem"
                    name="mensagem"
                    required>
                </textarea>

            </div>

            <button
                type="submit"
                class="contact-button">

                Enviar Mensagem

            </button>

        </form>

    </div>

</section>
